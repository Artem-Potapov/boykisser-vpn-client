# --- connectedAndroidTest data-safety default ---------------------------------------------------
# AGP's connectedAndroidTest UNINSTALLS the app-under-test after the run by default, which deletes
# /data/data/<pkg> — the app's Room DB and SharedPreferences. On a device holding real user data
# (imported profiles/subscriptions) that is a destructive wipe. This injected AGP option keeps the
# app installed after the run (verified in AGP 9.1.1: BooleanOption.ANDROID_TEST_LEAVE_APKS_INSTALLED_AFTER_RUN
# -> DeviceProviderInstrumentTestTask.keepInstalledApks, where uninstall = !keepInstalledApks).
# Uninstall is therefore OPT-IN. Re-enable it either way:
#   ./gradlew :app:connectedDebugAndroidTest -PuninstallAfterTest        (friendly alias; see settings.gradle.kts)
#   ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=false
android.injected.androidTest.leaveApksInstalledAfterRun=true